name: OrangeFox - Build
run-name: OrangeFox lmi LineageOS 23.2 decryption port

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: orangefox-lmi-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build OrangeFox for lmi
    runs-on: ubuntu-22.04
    timeout-minutes: 360
    if: github.event.repository.owner.id == github.event.sender.id
    permissions:
      contents: write
    env:
      LC_ALL: C
      LANG: C
      GIT_MASTER: '1'
      FOX_BUILD_DEVICE: lmi
      FOX_BUILD_TYPE: Unofficial
      ALLOW_MISSING_DEPENDENCIES: 'true'
      ANDROID_SOURCE: /tmp/fox
      GIT_AUTHOR_NAME: OrangeFox lmi builder
      GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
      GIT_COMMITTER_NAME: OrangeFox lmi builder
      GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout recovery adaptation
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Reclaim runner disk space
        uses: rokibhasansagar/slimhub_actions@c2a6e4317d3de2b623ac7395b05e9d2149e8289b

      - name: Configure build swap
        uses: pierotofy/set-swap-space@fc79b3f67fa8a838184ce84a674ca12238d2c761
        with:
          swap-size-gb: 12

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            bc bison build-essential ca-certificates curl flex g++-multilib \
            gcc-multilib git git-lfs gnupg gperf lib32ncurses-dev lib32z1-dev \
            binutils-aarch64-linux-gnu binutils-arm-linux-gnueabi \
            libelf-dev liblz4-tool libncurses5 libssl-dev libxml2-utils lzop \
            patch python3 python-is-python3 rsync unzip wget xsltproc zip \
            zlib1g-dev
          sudo curl --fail --location \
            https://storage.googleapis.com/git-repo-downloads/repo \
            --output /usr/local/bin/repo
          sudo chmod +x /usr/local/bin/repo
          mkdir -p logs artifacts
          df -h

      - name: Sync OrangeFox Android 16
        run: |
          # qcacld repeats the physical source path in its compiler flags.
          mkdir -p "$ANDROID_SOURCE"
          (
            cd "$ANDROID_SOURCE"
            repo init --depth=1 -u https://gitlab.com/OrangeFox/Manifest.git \
              -b 4c65ca28fa67580172ee6bf99892a054c19dcebe
            mkdir -p .repo/local_manifests
            cp "$GITHUB_WORKSPACE/port/remove-reference-devices.xml" .repo/local_manifests/
            repo sync -c -j4 --no-clone-bundle --no-tags
            repo manifest -r -o "$GITHUB_WORKSPACE/logs/manifest.xml"
          ) 2>&1 | tee logs/sync.log
          test -f "$ANDROID_SOURCE/bootable/recovery/Android.bp"

      - name: Constrain Soong graph builder memory
        run: |
          patch --batch --fuzz=0 -d "$ANDROID_SOURCE/build/soong" -p1 \
            < port/soong-memory.patch
          GIT_MASTER=1 git -C "$ANDROID_SOURCE/build/soong" diff \
            > artifacts/soong-memory.patch
          sha256sum artifacts/soong-memory.patch \
            | tee logs/soong-memory.sha256

      - name: Prepare recovery port from ROM hardware configuration
        run: |
          bash scripts/prepare-lmi.sh "$ANDROID_SOURCE" \
            2>&1 | tee logs/prepare.log

      - name: Build lmi kernel from pinned ROM sources
        run: |
          bash scripts/build-lmi-kernel.sh "$ANDROID_SOURCE" \
            2>&1 | tee logs/kernel.log

      - name: Build recovery image and OrangeFox installer
        run: |
          cd "$ANDROID_SOURCE"
          source build/envsetup.sh
          lunch twrp_lmi-bp2a-eng
          (
            while true; do
              date -u
              free -h
              swapon --show
              df -h "$ANDROID_SOURCE"
              for builder_pid in $(pgrep -x soong_build || :); do
                if [[ -r /proc/$builder_pid/environ ]]; then
                  printf 'soong_build pid=%s\n' "$builder_pid"
                  tr '\0' '\n' < "/proc/$builder_pid/environ" \
                    | grep -E '^(GOGC|GOMEMLIMIT)=' || :
                fi
              done
              for resource in /proc/self/cgroup /proc/pressure/memory \
                /sys/fs/cgroup/memory.current /sys/fs/cgroup/memory.max \
                /sys/fs/cgroup/memory.events; do
                if [[ -r $resource ]]; then
                  printf '%s\n' "$resource"
                  cat "$resource"
                fi
              done
              sleep 60
            done
          ) > >(tee "$GITHUB_WORKSPACE/logs/resources.log") 2>&1 &
          monitor=$!
          trap 'kill "$monitor" 2>/dev/null || :; wait "$monitor" 2>/dev/null || :' EXIT
          mka -j2 recoveryimage 2>&1 | tee "$GITHUB_WORKSPACE/logs/build.log"

      - name: Validate and collect recovery artifacts
        run: |
          product="$ANDROID_SOURCE/out/target/product/lmi"
          test -s "$product/recovery.img"
          cp "$product/recovery.img" artifacts/recovery.img
          shopt -s nullglob
          installers=("$product"/OrangeFox*.zip)
          test "${#installers[@]}" -gt 0
          for installer in "${installers[@]}"; do
            unzip -t "$installer"
            cp "$installer" artifacts/
          done
          python3 "$ANDROID_SOURCE/system/tools/mkbootimg/unpack_bootimg.py" \
            --boot_img artifacts/recovery.img --out artifacts/unpacked \
            | tee artifacts/image-info.txt
          test -s artifacts/unpacked/kernel
          test -s artifacts/unpacked/ramdisk
          test -s artifacts/unpacked/dtb
          test -s artifacts/unpacked/recovery_dtbo
          grep -qx 'boot image header version: 2' artifacts/image-info.txt
          test "$(stat -c %s artifacts/recovery.img)" -le 134217728
          cp "$ANDROID_SOURCE/device/xiaomi/lmi/PORT-SOURCES.txt" artifacts/
          cp "$ANDROID_SOURCE/device/xiaomi/lmi/CRYPTO-SHA256SUMS" artifacts/
          cp "$ANDROID_SOURCE/device/xiaomi/lmi/prebuilt/KERNEL-SHA256SUMS" artifacts/
          cp "$ANDROID_SOURCE/device/xiaomi/lmi/prebuilt/kernel.config" artifacts/
          cp logs/manifest.xml artifacts/
          (
            cd artifacts
            sha256sum recovery.img OrangeFox*.zip > SHA256SUMS
          )
          rm -rf artifacts/unpacked
          cat artifacts/image-info.txt artifacts/SHA256SUMS

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: orangefox-lmi-logs-${{ github.run_id }}
          path: logs/
          if-no-files-found: warn
          retention-days: 14

      - name: Upload verified recovery artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: orangefox-lmi-${{ github.run_id }}
          path: artifacts/
          if-no-files-found: error
          retention-days: 30

      - name: Publish unofficial lmi recovery
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: lmi-port-${{ github.run_id }}
          name: Unofficial OrangeFox lmi ROM-tree port
          prerelease: true
          fail_on_unmatched_files: true
          files: |
            artifacts/recovery.img
            artifacts/OrangeFox*.zip
            artifacts/SHA256SUMS
            artifacts/image-info.txt
            artifacts/PORT-SOURCES.txt
            artifacts/CRYPTO-SHA256SUMS
            artifacts/KERNEL-SHA256SUMS
            artifacts/kernel.config
            artifacts/manifest.xml
            artifacts/soong-memory.patch
          body: |
            Build configuration: ${{ github.server_url }}/${{ github.repository }}/tree/${{ github.sha }}
            Build logs: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
            Target: OrangeFox fox_16.0.
            Decryption target: LineageOS 23.2 (Android 16).
